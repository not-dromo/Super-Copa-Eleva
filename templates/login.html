{% extends "base.html" %}

{% block content %}
<h2>Login</h2>

{% if erro %}
  <p style="color: red;">{{ erro }}</p>
{% endif %}

<form method="POST">
    <label for="username">Login:</label>
    <input type="text" id="username" name="username" required>
    <button type="submit">Entrar</button>
</form>
{% endblock %}
